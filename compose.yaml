# DontSkipGym on the my VPS. Docker Compose prefers compose.yaml over
# docker-compose.yml, so a plain `docker compose up -d --build` in this directory uses this
# file; docker-compose.yml stays upstream's generic self-hosting setup.
#
# The main gym app, for self-hosting. The reverse proxy forwards gym.example.com to
# `gym:3000` over proxy-net, so the web container answers to exactly that: network alias `gym`,
# NGINX_PORT 3000. No NPM or Cloudflare change is needed.
#
# proxy-net is created --internal: no route off the host. The exercise media is fetched once on the
# host (scripts/fetch-media.sh), so nothing needs egress. The one thing that does is Web Push
# (rest-timer and reminder notifications), which therefore cannot deliver; enabling it means
# putting `api` on egress-net. See docs/SELF_HOSTING.md.
#
# All hardening lives here rather than in upstream's Dockerfiles, so their updates merge cleanly.
# Do not start the retired `previous-gym` container while this runs: both would answer to `gym`.
name: dontskipgym

networks:
  proxy-net:
    external: true
  # web <-> api only. NPM is not on it, so the API is reachable only through web.
  backend:
    internal: true

volumes:
  dsg-data:   # users, passkeys, password hashes, per-user state, session + VAPID keys, audit log

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  cpus: 0.5
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

services:
  api:
    build:
      context: ./api
      target: default            # no AI Coach runtime
    image: dontskipgym-api:local
    container_name: dontskipgym-api
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
    user: "1000:1000"            # upstream's image runs as root; the data volume is owned by 1000
    volumes:
      - dsg-data:/data
    networks: [backend]
    <<: *hardening
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    mem_limit: 192m
    memswap_limit: 192m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - VITE_APP_NAME=DontSkipGym
    image: dontskipgym-web:local
    container_name: dontskipgym-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NGINX_PORT=3000
      - BACKEND=api
      - PORT=3000
      - RESOLVER=127.0.0.11
    # nginx as its own unprivileged user instead of root. Its entrypoint renders the config
    # template into conf.d at start, so that and nginx's pid/cache paths are small tmpfs mounts
    # owned by that user; everything else stays read-only.
    user: "101:101"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
    networks:
      proxy-net:
        aliases: [gym]
      backend: {}
    <<: *hardening
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s
