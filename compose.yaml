# DontSkipGym: hardened self-hosting setup. Docker Compose prefers compose.yaml over
# docker-compose.yml, so a plain `docker compose up -d --build` in this directory uses this
# file; docker-compose.yml stays upstream's generic self-hosting setup.
#
# Everything site-specific is a variable (see .env.example) or lives in a gitignored
# compose.override.yaml, so nothing about your own server needs to be committed:
#   DATA_DIR      host folder for users, passkeys, password hashes, per-user state, session +
#                 VAPID keys and the audit log (default ./data; must be writable by uid 1000)
#   HOST_PORT     port published on 127.0.0.1 for your reverse proxy (default 3000)
#   TAG           image tag (default local)
#   COMPOSE_PROJECT_NAME  compose project name (default dontskipgym)
# To join an existing reverse-proxy network instead of publishing a port, add a
# compose.override.yaml (copy compose.override.example.yaml).
#
# The api sits on an internal network that only the web container shares, so the API is
# reachable only through web. The exercise media is fetched once on the host
# (scripts/fetch-media.sh). Web Push needs outbound access from `api`; with the internal
# network it cannot deliver. See docs/SELF_HOSTING.md.
#
# All hardening lives here rather than in upstream's Dockerfiles, so their updates merge cleanly.
name: ${COMPOSE_PROJECT_NAME:-dontskipgym}

networks:
  # web's way out to the published port (an internal network cannot publish one).
  public: {}
  # web <-> api only. No proxy is on it, so the API is reachable only through web.
  backend:
    internal: true

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  cpus: 0.5
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

services:
  api:
    build:
      context: ./api
      target: default            # no AI Coach runtime
    image: dontskipgym-api:${TAG:-local}
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
    user: "1000:1000"            # upstream's image runs as root; the data volume is owned by 1000
    volumes:
      - ${DATA_DIR:-./data}:/data
    networks: [backend]
    <<: *hardening
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    mem_limit: 192m
    memswap_limit: 192m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - VITE_APP_NAME=DontSkipGym
    image: dontskipgym-web:${TAG:-local}
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NGINX_PORT=3000
      - BACKEND=api
      - PORT=3000
      - RESOLVER=127.0.0.11
    # nginx as its own unprivileged user instead of root. Its entrypoint renders the config
    # template into conf.d at start, so that and nginx's pid/cache paths are small tmpfs mounts
    # owned by that user; everything else stays read-only.
    user: "101:101"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    networks: [public, backend]
    <<: *hardening
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s
